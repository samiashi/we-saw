name: Migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Supabase secrets
        id: check
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migration skipped::Set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF repository secrets to enable automatic migrations."
          fi
      - uses: supabase/setup-cli@v3
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest
      - name: Link project
        if: steps.check.outputs.skip != 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Push migrations
        if: steps.check.outputs.skip != 'true'
        run: supabase db push
