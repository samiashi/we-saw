name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Lint, Typecheck & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Self-updating: lts/* is the active LTS line, latest is the newest
        # current release. Future Node versions are picked up automatically
        # and deprecated versions are never tested.
        node: ["lts/*", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@latest autorun
