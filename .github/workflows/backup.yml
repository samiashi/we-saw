name: Backup

on:
  schedule:
    # Every Sunday at 03:00 UTC.
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  dump:
    name: Dump Supabase schema and data
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Supabase secrets
        id: check
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backup skipped::Set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF repository secrets to enable backups."
          fi
      - uses: supabase/setup-cli@v3
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest
      - name: Link project
        if: steps.check.outputs.skip != 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Dump schema and data
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p backup
          supabase db dump --linked -f backup/schema.sql --schema public
          supabase db dump --linked --data-only -f backup/data.sql --schema public
      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.skip != 'true'
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backup/
          retention-days: 30
